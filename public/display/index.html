<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>RGI Immobilien &ndash; Schaufensteranzeige</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================
   Schriften - liegen neben dieser Datei unter fonts/ und werden
   nicht aus dem Netz geladen. Faellt das Internet aus, sieht der
   Bildschirm trotzdem richtig aus.

   Jost      ersetzt Century Gothic (geometrische Grotesk, SIL OFL)
   Work Sans Fliesstext, wie auf der Website (SIL OFL)
   ============================================================ */
@font-face{ font-family:'Jost'; src:url('fonts/jost-600.woff2') format('woff2'); font-weight:600; font-style:normal; }
@font-face{ font-family:'Jost'; src:url('fonts/jost-700.woff2') format('woff2'); font-weight:700; font-style:normal; }
@font-face{ font-family:'Work Sans'; src:url('fonts/worksans-400.woff2') format('woff2'); font-weight:400; font-style:normal; }
@font-face{ font-family:'Work Sans'; src:url('fonts/worksans-500.woff2') format('woff2'); font-weight:500; font-style:normal; }
@font-face{ font-family:'Work Sans'; src:url('fonts/worksans-600.woff2') format('woff2'); font-weight:600; font-style:normal; }
@font-face{ font-family:'Work Sans'; src:url('fonts/worksans-700.woff2') format('woff2'); font-weight:700; font-style:normal; }
@font-face{ font-family:'Work Sans'; src:url('fonts/worksans-800.woff2') format('woff2'); font-weight:800; font-style:normal; }

/* ============================================================
   RGI Immobilien - Schaufensteranzeige
   Zielgeraet: Samsung OM55N-S, Hochformat 1080 x 1920
   (Querformat wird ebenfalls sauber dargestellt)

   Farben und Schriften stammen aus dem Code der RGI-
   VerwaltungsApp, damit Bildschirm, App und Flyer identisch
   wirken.

   Bewusst konservatives CSS: kein CSS-Grid, kein flex-gap,
   kein backdrop-filter - der Tizen-4.0-Browser des OM55N-S
   entspricht etwa Chrome 56.
   ============================================================ */

:root{
  --orange:#ee7202;
  --orange-dark:#d6650b;
  --orange-soft:#fdf0e3;
  --bg:#faf8f5;
  --card:#ffffff;
  --line:#e7e0d8;
  --text:#1f1a14;
  --muted:#7a6f63;
}

*{ -webkit-box-sizing:border-box; box-sizing:border-box; margin:0; padding:0; }

/* 1rem = 1 % der kuerzeren Bildschirmkante (zusaetzlich per JS gesetzt) */
html{ font-size:1vmin; }

html,body{
  width:100%; height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:'Work Sans','Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none; user-select:none;
  cursor:none;
}

.head{
  font-family:'Jost','Century Gothic',CenturyGothic,'Work Sans',Arial,sans-serif;
  font-weight:600;
  letter-spacing:-0.02em;
  line-height:1.12;
}

#stage{ position:absolute; top:0; left:0; right:0; bottom:0; }

.slide{
  position:absolute; top:0; left:0; width:100%; height:100%;
  opacity:0;
  -webkit-transition:opacity 800ms ease;
  transition:opacity 800ms ease;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
  background:var(--bg);
}
.slide.is-active{ opacity:1; }
.slide.is-out{ opacity:0; }

/* ============================================================
   Fernzone - aus 10 bis 15 m lesbar
   ============================================================ */
/* Feste Hoehe, damit die Trennkante zum Foto zwischen den
   Folien nicht springt - die Schlagzeile sitzt immer unten. */
.far{
  -webkit-flex:0 0 23%; flex:0 0 23%;
  background:var(--bg);
  padding:4.6rem 5rem 3.4rem 5rem;
  position:relative;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
  overflow:hidden;
}

.far-top{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center;
  -webkit-justify-content:space-between; justify-content:space-between;
}
.far-top .logo{ height:6.4rem; width:auto; display:block; }

.pill{
  font-size:2.1rem; font-weight:700; letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--orange-dark);
  background:var(--orange-soft);
  border:2px solid rgba(238,114,2,.28);
  padding:.9rem 2.2rem; border-radius:99px;
  white-space:nowrap;
}
.pill.is-rent{
  color:#1f5f8b; background:#e9f2f8; border-color:rgba(31,95,139,.25);
}

/* Die Schlagzeile bleibt immer einzeilig. Die Schriftgroesse
   wird per JS so weit reduziert, bis das Wort in eine Zeile
   passt - kurze Begriffe werden dadurch sehr gross. */
.headline{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  font-family:'Jost','Century Gothic',CenturyGothic,'Work Sans',Arial,sans-serif;
  font-weight:700;
  letter-spacing:-0.035em;
  line-height:1;
  color:var(--text);
  font-size:17rem;   /* Startwert, wird per JS verkleinert */
  margin-top:auto;   /* schiebt Schlagzeile und Sublinie nach unten */
}

.subline{
  margin-top:2.2rem;
  font-size:3.4rem; font-weight:500;
  color:var(--muted);
}
.subline .dot{
  display:inline-block; width:1.2rem; height:1.2rem; border-radius:50%;
  background:var(--orange); margin-right:1.4rem; vertical-align:middle;
}

.rule{
  height:.5rem; width:14rem; background:var(--orange);
  margin-top:3rem; border-radius:99px;
}

/* ============================================================
   Fotozone
   ============================================================ */
.photo{
  -webkit-flex:1 1 auto; flex:1 1 auto;
  position:relative; overflow:hidden;
  background:#efeae4;
  min-height:0;
}
.photo img{
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  object-fit:cover;
  -webkit-animation:kb 18s ease-out forwards;
  animation:kb 18s ease-out forwards;
}
@-webkit-keyframes kb{ from{ -webkit-transform:scale(1);} to{ -webkit-transform:scale(1.06);} }
@keyframes kb{ from{ transform:scale(1);} to{ transform:scale(1.06);} }

/* Dezenter Balken fuer Referenzobjekte */
.sold{
  position:absolute; left:0; right:0; bottom:0; z-index:3;
  background:var(--orange);
  color:#fff;
  font-size:2.6rem; font-weight:700; letter-spacing:.2em;
  text-transform:uppercase; text-align:center;
  padding:1.5rem 2rem;
}

.shots{
  position:absolute; right:3rem; top:3rem; z-index:3;
  background:rgba(31,26,20,.6); color:#fff;
  font-size:1.9rem; font-weight:500;
  padding:.7rem 1.6rem; border-radius:99px;
}

/* ============================================================
   Nahzone - liest, wer stehen bleibt
   ============================================================ */
.near{
  -webkit-flex:0 0 auto; flex:0 0 auto;
  background:var(--card);
  border-top:2px solid var(--line);
  padding:4rem 5rem 3.4rem 5rem;
}

.price{
  font-size:7.4rem; font-weight:800; color:var(--orange);
  letter-spacing:-0.035em; line-height:1;
}
.price .unit{ font-size:3rem; font-weight:600; letter-spacing:0; margin-left:.8rem; }
.price-sub{
  font-size:2.1rem; font-weight:500; color:var(--muted);
  margin-top:1.2rem;
}

.facts{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-flex-wrap:wrap; flex-wrap:wrap;
  margin:3rem -1.8rem 0 -1.8rem;
}
.fact{ padding:0 1.8rem 2rem 1.8rem; }
.fact .v{ font-size:4rem; font-weight:700; line-height:1; }
.fact .v small{ font-size:2.3rem; font-weight:600; }
.fact .k{
  font-size:1.7rem; font-weight:600; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted); margin-top:.7rem;
}

.chips{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-flex-wrap:wrap; flex-wrap:wrap;
  margin:1rem -.6rem 0 -.6rem;
}
.chip{
  margin:0 .6rem 1.1rem .6rem;
  border:2px solid var(--line);
  background:var(--bg);
  color:var(--text);
  font-size:1.9rem; font-weight:600;
  padding:.7rem 1.7rem; border-radius:99px;
}

/* Pflichtangaben nach GEG - stehen ausserhalb beschnittener
   Bereiche und werden nie gekuerzt. */
.energy{
  font-size:1.8rem; font-weight:500; line-height:1.5;
  color:var(--muted);
  border-top:2px solid var(--line);
  padding-top:2rem; margin-top:2.4rem;
}
.energy b{ color:var(--text); font-weight:700; }

.cta{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center;
  border-top:2px solid var(--line);
  padding-top:2.8rem; margin-top:2.8rem;
}
.qr{
  -webkit-flex:0 0 auto; flex:0 0 auto;
  width:17rem; height:17rem;
  background:#fff; padding:.9rem;
  border:2px solid var(--line); border-radius:1.4rem;
  margin-right:3rem;
}
.qr svg{ display:block; width:100%; height:100%; }
.cta-txt{ min-width:0; }
.cta-txt .l1{ font-size:2.8rem; font-weight:700; line-height:1.25; }
.cta-txt .l2{ font-size:2.4rem; font-weight:600; color:var(--orange); margin-top:.7rem; }
.cta-txt .l3{ font-size:1.9rem; font-weight:500; color:var(--muted); margin-top:.7rem; }

/* ============================================================
   Kontaktleiste - laeuft auf jeder Folie mit
   ============================================================ */
.bar{
  -webkit-flex:0 0 auto; flex:0 0 auto;
  background:var(--text); color:rgba(255,255,255,.82);
  font-size:1.42rem; font-weight:500;
  padding:1.7rem 4.2rem;
  white-space:nowrap; overflow:hidden;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center;
  -webkit-justify-content:space-between; justify-content:space-between;
}
.bar .info{ -webkit-flex:1 1 auto; flex:1 1 auto; min-width:0; overflow:hidden; }
.bar .clock{ -webkit-flex:0 0 auto; flex:0 0 auto; margin-left:2.4rem; }
.bar b{ color:#fff; font-weight:700; }
.bar .sep{ color:var(--orange); margin:0 1.2rem; font-weight:700; }
.bar .clock{ color:#fff; font-weight:700; }

/* ============================================================
   Inhaltsfolien (Kundenstimme, Fachbereich, App, Auftakt)
   ============================================================ */
.body{
  -webkit-flex:1 1 auto; flex:1 1 auto;
  min-height:0; overflow:hidden;
  background:var(--card);
  padding:4.4rem 5rem;
}
.body.on-bg{ background:var(--bg); }
.body.center{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
  -webkit-justify-content:center; justify-content:center;
  padding-left:6rem; padding-right:6rem;
}

.lead{
  font-size:2.8rem; font-weight:400; line-height:1.55;
  color:var(--muted);
}
.lead b{ color:var(--text); font-weight:600; }

.points{ margin-top:3.4rem; }
.point{
  display:-webkit-box; display:-webkit-flex; display:flex;
  margin-bottom:2.4rem;
}
.point .n{
  -webkit-flex:0 0 auto; flex:0 0 auto;
  width:5.4rem; height:5.4rem; border-radius:1.2rem;
  background:var(--orange-soft); color:var(--orange);
  font-size:2.2rem; font-weight:800;
  text-align:center; line-height:5.4rem;
  margin-right:2.4rem;
}
.point .t{ font-size:2.5rem; font-weight:600; line-height:1.4; padding-top:.7rem; }

/* --- Kundenstimme --- */
.quote{
  font-family:'Jost','Century Gothic',CenturyGothic,'Work Sans',Arial,sans-serif;
  font-size:5.6rem; font-weight:500; line-height:1.38;
  letter-spacing:-0.02em;
  color:var(--text);
}
.stars{ margin-top:4rem; line-height:0; }
.stars svg{
  width:4.4rem; height:4.4rem; fill:#f5a623;
  display:inline-block; vertical-align:middle; margin-right:.8rem;
}
.author{
  margin-top:1.6rem; font-size:2.4rem; font-weight:600; color:var(--muted);
}
.author .role{ display:block; font-size:1.9rem; font-weight:500; margin-top:.6rem; }

/* --- Jahreszyklus --- */
.cycle{ margin-top:3.4rem; }
.step{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center;
  border-bottom:2px solid var(--line);
  padding:1.9rem 0;
}
.step:last-child{ border-bottom:0; }
.step .num{
  -webkit-flex:0 0 auto; flex:0 0 auto;
  width:4.6rem; height:4.6rem; border-radius:99px;
  border:.35rem solid var(--orange);
  color:var(--orange); font-size:1.9rem; font-weight:800;
  text-align:center; line-height:3.9rem;
  margin-right:2.4rem;
}
.step .lbl{ font-size:2.7rem; font-weight:600; }
.step .sub{ font-size:1.9rem; font-weight:500; color:var(--muted); margin-top:.3rem; }

.appwrap{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center;
  margin-top:3rem;
}
.appphone{
  -webkit-flex:0 0 44%; flex:0 0 44%;
  padding-right:3rem;
}
.appphone img{ display:block; width:100%; height:auto; }
.appmain{ -webkit-flex:1 1 auto; flex:1 1 auto; min-width:0; }
.appmain .cycle{ margin-top:0; }

.features{
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-flex-wrap:wrap; flex-wrap:wrap;
  margin:2.6rem -.6rem 0 -.6rem;
}
.feature{
  margin:0 .6rem 1.1rem .6rem;
  background:var(--orange-soft); color:var(--orange-dark);
  border:2px solid rgba(238,114,2,.2);
  font-size:1.9rem; font-weight:600;
  padding:.7rem 1.7rem; border-radius:99px;
}

/* --- Auftaktfolie ---------------------------------------
   Im Hochformat wird das fertig gestaltete Bild (1080x1920)
   randlos gezeigt - kein Zoom, kein Zuschnitt, keine
   Kontaktleiste, weil die Gestaltung bereits geschlossen ist.
   Im Querformat greift die aufgebaute Fassung darunter.
   -------------------------------------------------------- */
.auftakt{
  -webkit-flex:1 1 auto; flex:1 1 auto;
  position:relative; overflow:hidden; background:#f2efeb;
}
.auftakt-img{
  position:absolute; top:0; left:0; width:100%; height:100%;
  object-fit:cover;
}
.auftakt .opening{ display:none; }
.auftakt ~ .bar{ display:none; }

/* --- aufgebaute Auftaktfolie (Querformat) --- */
.opening{
  -webkit-flex:1 1 auto; flex:1 1 auto;
  position:relative; overflow:hidden; background:#2a251f;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
  -webkit-justify-content:flex-end; justify-content:flex-end;
}
/* Nur das direkte Hintergrundbild, nicht das Logo darin. */
.opening > img{
  position:absolute; top:0; left:0; width:100%; height:100%;
  object-fit:cover;
  -webkit-animation:kb 22s ease-out forwards; animation:kb 22s ease-out forwards;
}
.opening .scrim{
  position:absolute; top:0; left:0; width:100%; height:100%; z-index:1;
  background:-webkit-linear-gradient(top, rgba(31,26,20,.15) 0%, rgba(31,26,20,.86) 62%, rgba(31,26,20,.95) 100%);
  background:linear-gradient(to bottom, rgba(31,26,20,.15) 0%, rgba(31,26,20,.86) 62%, rgba(31,26,20,.95) 100%);
}
.opening .inner{ position:relative; z-index:2; padding:5rem 5rem 5rem 5rem; }
.opening .logo-lg{ position:static; height:9rem; width:auto; display:block; }
.opening .logo-row{ margin-bottom:4rem; overflow:hidden; }
.opening h1{
  font-family:'Jost','Century Gothic',CenturyGothic,'Work Sans',Arial,sans-serif;
  font-weight:600; letter-spacing:-0.025em; line-height:1.15;
  font-size:7.6rem; color:#fff;
}
.opening .tag{
  margin-top:3rem; font-size:3rem; font-weight:600;
  color:#fff; opacity:.85; letter-spacing:.02em;
}
.opening .tag i{ color:var(--orange); font-style:normal; font-weight:700; margin:0 1rem; }

/* ============================================================
   Fortschrittsbalken und Statusfeld
   ============================================================ */
/* Fortschrittsbalken laeuft als eine einzige CSS-Bewegung durch -
   dadurch fluessig statt ruckweise. */
#bar{
  position:absolute; left:0; bottom:0; height:.55rem; width:100%;
  background:var(--orange); z-index:60;
  -webkit-transform:scaleX(0); transform:scaleX(0);
  -webkit-transform-origin:left center; transform-origin:left center;
  will-change:transform;
}
#dbg{
  position:absolute; top:0; left:0; z-index:99;
  background:rgba(0,0,0,.82); color:#0f0;
  font-family:monospace; font-size:1.5rem;
  padding:1rem 1.4rem; max-width:70%;
  white-space:pre-wrap; display:none;
}

/* ============================================================
   Querformat - gleiche Bausteine, zweispaltig
   ============================================================ */
@media (orientation:landscape){
  .slide{ display:block; }
  .far{
    position:absolute; top:0; left:0; width:44%; height:100%;
    padding:4.4rem 4rem 8.5rem 4.4rem;
    border-right:2px solid var(--line);
    overflow:hidden;
  }
  .photo{
    position:absolute; top:0; left:44%; right:0; height:40%;
    width:auto;
  }
  /* Im Querformat ist die Nahzone flacher - Schrift, QR und
     Abstaende werden entsprechend zurueckgenommen, damit die
     Pflichtangaben und der QR-Code sicher hineinpassen. */
  .near{
    position:absolute; top:40%; left:44%; right:0; bottom:6.2rem;
    border-top:0; border-left:0;
    padding:2.8rem 4.4rem 1.8rem 4.4rem;
    overflow:hidden;
  }
  .near .facts{ margin-top:1.8rem; }
  .near .chips{ margin-top:.4rem; }
  .near .fact{ padding-bottom:1.4rem; }
  .near .fact .v{ font-size:3.2rem; }
  .near .energy{ padding-top:1.6rem; margin-top:1.8rem; }
  .near .cta{ padding-top:1.6rem; margin-top:1.6rem; }
  .near .qr{ width:12.5rem; height:12.5rem; margin-right:2.2rem; }
  .near .cta-txt .l1{ font-size:2.3rem; }
  .near .cta-txt .l2{ font-size:2rem; }
  .near .cta-txt .l3{ font-size:1.7rem; }
  .near .price-sub{ margin-top:.8rem; }
  .body{
    position:absolute; top:0; left:44%; right:0; bottom:6.2rem;
    padding:4rem 4.4rem;
  }
  .auftakt{
    position:absolute; top:0; left:0; right:0; bottom:6.2rem;
  }
  .auftakt-img{ display:none; }
  .auftakt ~ .bar{ display:-webkit-box; display:-webkit-flex; display:flex; }
  .opening{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:-webkit-box; display:-webkit-flex; display:flex;
  }
  .auftakt .opening{ display:-webkit-box; display:-webkit-flex; display:flex; }
  .bar{
    position:absolute; left:0; right:0; bottom:0; height:6.2rem;
    padding:0 4.4rem;
  }
  .headline{ font-size:12rem; }
  .quote{ font-size:3.8rem; }
  .price{ font-size:6rem; }
  .opening h1{ font-size:6.4rem; }
}
</style>
</head>
<body>

<div id="stage"></div>
<div id="bar"></div>
<pre id="dbg"></pre>

<script>
/* ============================================================
   RGI Immobilien - Schaufensteranzeige
   Zielgeraet: Samsung OM55N-S (Tizen 4.0 / SSSP6, ~Chrome 56)

   Bewusst ES5: kein let/const, keine Arrow Functions, keine
   Template Literals, kein fetch, kein Promise, kein Optional
   Chaining. Nur XMLHttpRequest und klassische Funktionen.

   Steuerung per URL-Parameter, z. B.
     /display/?dauer=16&ort=Pfronten&debug=1

     dauer            Sekunden je Objektfolie      (Standard 16)
     inhaltsdauer     Sekunden je Inhaltsfolie     (Standard 13)
     ort              nur Objekte aus diesem Ort
     max              hoechstens N Objekte
     puls             Sekunden je Aenderungspruefung (Standard 30)
     aktualisierung   Minuten bis zum Vollabruf      (Standard 10)
     debug=1          Statusfeld einblenden
   ============================================================ */
(function(){
'use strict';

/* ------------------------------------------------------------
   Konfiguration - hier lassen sich Bilder und Texte tauschen,
   ohne den Rest der Datei anzufassen.
   ------------------------------------------------------------ */
var SUPABASE_URL = 'https://jsrhluehonepowausjzt.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzcmhsdWVob25lcG93YXVzanp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NTY2MjcsImV4cCI6MjA4MzUzMjYyN30.Ld9YIabNPYpTEv5Q3wZhFU8sp7u09ZKi-0QGcVgD4DI';

function setRootSize(){
  var w = window.innerWidth  || document.documentElement.clientWidth  || 1080;
  var h = window.innerHeight || document.documentElement.clientHeight || 1920;
  var base = Math.min(w, h) / 100;
  if (base < 4)  { base = 4; }
  if (base > 24) { base = 24; }
  document.documentElement.style.fontSize = base + 'px';
}
setRootSize();
if (window.addEventListener) {
  window.addEventListener('resize', setRootSize, false);
  window.addEventListener('orientationchange', setRootSize, false);
}

/* ============================================================
   Hilfsfunktionen
   ============================================================ */
function nowMs(){ return (new Date()).getTime(); }
function pad(n){ return (n < 10 ? '0' : '') + n; }

function num(v, def){
  var n = parseFloat(v);
  return (isFinite(n) && n > 0) ? n : def;
}

function parseQuery(){
  var out = {};
  var s = window.location.search.replace(/^\?/, '');
  if (!s) { return out; }
  var parts = s.split('&');
  for (var i = 0; i < parts.length; i++){
    var kv = parts[i].split('=');
    if (kv[0]) { out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' ')); }
  }
  return out;
}

function esc(s){
  if (s === null || s === undefined) { return ''; }
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* Deutsche Zahlformatierung ohne Intl - manche Tizen-Builds
   liefern kein vollstaendiges ICU mit. */
function deNum(n, decimals){
  if (n === null || n === undefined || !isFinite(n)) { return ''; }
  var neg = n < 0;
  n = Math.abs(n);
  var d = (decimals === undefined) ? 0 : decimals;
  var split = n.toFixed(d).split('.');
  var whole = split[0];
  var frac  = split.length > 1 ? split[1] : '';
  var out = '', c = 0;
  for (var i = whole.length - 1; i >= 0; i--){
    out = whole.charAt(i) + out;
    c++;
    if (c % 3 === 0 && i > 0) { out = '.' + out; }
  }
  if (frac) { out = out + ',' + frac; }
  return (neg ? '-' : '') + out;
}

/* Nachkommastellen anzeigen, aber keine erfinden:
   3,57 bleibt 3,57 - 120,0 wird zu 120. */
function deSmart(n, maxDec){
  if (n === null || n === undefined || !isFinite(n)) { return ''; }
  var s = deNum(n, (maxDec === undefined) ? 1 : maxDec);
  if (s.indexOf(',') !== -1) {
    s = s.replace(/0+$/, '').replace(/,$/, '');
  }
  return s;
}

function qrSvg(key){
  var d = QR[key];
  if (!d) { return ''; }
  return '<svg viewBox="0 0 29 29" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'
       + '<path fill="#1f1a14" d="' + d + '"/></svg>';
}

/* Sterne als Vektor - kein Schriftzeichen, das auf dem Bildschirm
   fehlen koennte. */
function sterneHtml(n){
  var d = 'M12 2.4l2.94 5.96 6.58.96-4.76 4.64 1.12 6.55L12 17.42 '
        + '6.12 20.51l1.12-6.55L2.48 9.32l6.58-.96z';
  var out = '<div class="stars">';
  for (var i = 0; i < n; i++){
    out += '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="' + d + '"/></svg>';
  }
  return out + '</div>';
}

/* ============================================================
   Datenabruf
   ============================================================ */
function statusFilter(){
  return 'available,' + encodeURIComponent('verfügbar') + ',sold,rented';
}

function buildUrl(){
  var sel = 'id,title,description,transaction_type,property_type,'
          + (mitSubtype ? 'property_subtype,' : '')
          + 'postal_code,city,district,'
          + 'living_space,plot_size,rooms,floor_number,year_built,'
          + 'has_balcony,has_terrace,has_garden,has_cellar,has_parking,has_elevator,'
          + 'has_guest_toilet,has_fitted_kitchen,is_barrier_free,'
          + 'purchase_price,cold_rent,warm_rent,provision,'
          + 'energy_value,energy_efficiency_class,energy_certificate_type,'
          + 'heating_type,energy_source,'
          + 'availability_status,is_active,reference_sort_order,created_at,'
          + 'property_images(image_url,sort_order)';

  var u = SUPABASE_URL + '/rest/v1/properties'
        + '?select=' + encodeURIComponent(sel)
        + '&availability_status=in.(' + statusFilter() + ')'
        + '&order=created_at.desc';

  if (FILTER_ORT) { u += '&city=eq.' + encodeURIComponent(FILTER_ORT); }
  return u;
}

function load(){
  var xhr = new XMLHttpRequest();
  try { xhr.open('GET', buildUrl(), true); }
  catch (e) { onFail('open'); return; }

  xhr.timeout = 20000;
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  xhr.setRequestHeader('Accept', 'application/json');

  xhr.onreadystatechange = function(){
    if (xhr.readyState !== 4) { return; }
    if (xhr.status >= 200 && xhr.status < 300) {
      var data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e2) { data = null; }
      if (data && data.length !== undefined) { onData(data); }
      else { onFail('parse'); }
    } else if (xhr.status === 400 && mitSubtype) {
      /* Die optionale Spalte property_subtype gibt es noch nicht -
         einmalig ohne sie erneut abfragen. */
      mitSubtype = false;
      dbg('property_subtype nicht vorhanden, Abfrage ohne die Spalte');
      load();
    } else {
      onFail('http ' + xhr.status);
    }
  };
  xhr.ontimeout = function(){ onFail('timeout'); };
  xhr.onerror   = function(){ onFail('network'); };
  try { xhr.send(null); } catch (e3) { onFail('send'); }
}

function onData(list){
  partition(list);
  saveCache(list);
  dbg('geladen: ' + offers.length + ' Angebote, ' + refs.length + ' Referenzen');
  if (!current) { start(); }
  else { datenNeu = true; }   /* Ablaufplan an der naechsten Folienkante erneuern */
}

/* ------------------------------------------------------------
   Pulsabfrage: fragt nur Anzahl und juengstes Aenderungsdatum
   ab - wenige hundert Byte. Erst wenn sich daran etwas aendert,
   werden die vollstaendigen Daten geholt. Dadurch erscheint ein
   neues oder geaendertes Objekt binnen rund einer halben Minute
   auf dem Bildschirm, ohne die Datenbank zu belasten.
   ------------------------------------------------------------ */
function pulse(){
  var u = SUPABASE_URL + '/rest/v1/properties'
        + '?select=updated_at'
        + '&availability_status=in.(' + statusFilter() + ')'
        + '&order=updated_at.desc&limit=1';
  if (FILTER_ORT) { u += '&city=eq.' + encodeURIComponent(FILTER_ORT); }

  var xhr = new XMLHttpRequest();
  try { xhr.open('GET', u, true); } catch (e) { return; }
  xhr.timeout = 12000;
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  xhr.setRequestHeader('Accept', 'application/json');
  xhr.setRequestHeader('Prefer', 'count=exact');

  xhr.onreadystatechange = function(){
    if (xhr.readyState !== 4) { return; }
    if (xhr.status < 200 || xhr.status >= 300) { return; }
    var anzahl = '';
    try { anzahl = xhr.getResponseHeader('Content-Range') || ''; } catch (e2) { anzahl = ''; }
    var kennung = anzahl + '|' + xhr.responseText;

    if (fingerAbdruck === null) { fingerAbdruck = kennung; return; }
    if (kennung !== fingerAbdruck) {
      fingerAbdruck = kennung;
      dbg('Aenderung erkannt, lade neu');
      load();
    }
  };
  xhr.onerror   = function(){};
  xhr.ontimeout = function(){};
  try { xhr.send(null); } catch (e3) { /* stillhalten, naechster Puls */ }
}

function onFail(why){
  dbg('Fehler: ' + why);
  if (!current) {
    var cached = loadCache();
    if (cached) { partition(cached); dbg('Cache: ' + offers.length + '/' + refs.length); }
    start();
  }
}

function isAvailable(p){
  return (p.availability_status === 'available' || p.availability_status === 'verfügbar')
      && p.is_active === true;
}
function isReference(p){
  return p.availability_status === 'sold' || p.availability_status === 'rented';
}

function partition(list){
  var a = [], r = [], i, j;
  for (i = 0; i < list.length; i++){
    var p = list[i];
    if (!p || !p.id || !p.title) { continue; }

    var imgs = p.property_images || [];
    imgs.sort(function(x, y){ return (x.sort_order || 0) - (y.sort_order || 0); });
    var urls = [];
    for (j = 0; j < imgs.length; j++){
      if (imgs[j] && imgs[j].image_url) { urls.push(imgs[j].image_url); }
    }
    p._imgs = urls;

    if (isAvailable(p))      { a.push(p); }
    else if (isReference(p)) { r.push(p); }
  }
  r.sort(function(x, y){
    var ox = (x.reference_sort_order === null || x.reference_sort_order === undefined) ? 999 : x.reference_sort_order;
    var oy = (y.reference_sort_order === null || y.reference_sort_order === undefined) ? 999 : y.reference_sort_order;
    return ox - oy;
  });
  if (MAX_OBJECTS > 0) { a = a.slice(0, MAX_OBJECTS); }
  offers = a;
  refs   = r;
}

function saveCache(list){
  try { window.localStorage.setItem(CACHE_KEY, JSON.stringify({ t: nowMs(), d: list })); }
  catch (e) { /* privater Modus - egal */ }
}
function loadCache(){
  try {
    var raw = window.localStorage.getItem(CACHE_KEY);
    if (!raw) { return null; }
    var o = JSON.parse(raw);
    return (o && o.d && o.d.length) ? o.d : null;
  } catch (e) { return null; }
}

/* ============================================================
   Objektbeschriftung
   ============================================================ */

/* Die Datenbank kennt nur vier grobe Immobilienarten.
   Bei Wohnungen laesst sich aus der Zimmerzahl eine
   praezisere Bezeichnung bilden. */
function objektart(p){
  /* Wenn in der Datenbank eine genauere Bezeichnung hinterlegt
     ist (Spalte property_subtype, z. B. "Einfamilienhaus" oder
     "Hotel"), hat diese Vorrang. */
  if (p.property_subtype) { return String(p.property_subtype); }

  var t = p.property_type;
  if (t === 'Wohnung') {
    if (p.rooms) { return deSmart(p.rooms, 1) + '-Zimmer-Wohnung'; }
    return 'Eigentumswohnung';
  }
  if (t === 'Haus')       { return 'Haus'; }
  if (t === 'Grundstück') { return 'Grundstück'; }
  if (t === 'Gewerbe')    { return 'Gewerbefläche'; }
  return t || 'Immobilie';
}

function ortZeile(p){
  var parts = [];
  if (p.postal_code) { parts.push(esc(p.postal_code)); }
  if (p.city)        { parts.push(esc(p.city)); }
  var s = parts.join(' ');
  if (p.district) { s += (s ? ' &ndash; ' : '') + esc(p.district); }
  return s || 'Standort auf Anfrage';
}

function preisBlock(p){
  if (p.transaction_type === 'rent') {
    if (!p.cold_rent) { return '<div class="price" style="font-size:4.4rem">Miete auf Anfrage</div>'; }
    return '<div class="price">' + deNum(p.cold_rent, 0) + '&nbsp;&euro;'
         + '<span class="unit">/ Monat</span></div>'
         + '<div class="price-sub">Kaltmiete'
         + (p.warm_rent ? '&nbsp;&middot;&nbsp;Warmmiete ' + deNum(p.warm_rent, 0) + '&nbsp;&euro;' : '')
         + '</div>';
  }
  if (!p.purchase_price) { return '<div class="price" style="font-size:4.4rem">Preis auf Anfrage</div>'; }
  return '<div class="price">' + deNum(p.purchase_price, 0) + '&nbsp;&euro;</div>'
       + '<div class="price-sub">Kaufpreis'
       + (p.provision ? '&nbsp;&middot;&nbsp;K&auml;uferprovision ' + deSmart(p.provision, 2) + '&nbsp;% inkl. MwSt.' : '')
       + '</div>';
}

function faktenBlock(p, maxCount){
  var f = [];
  if (p.rooms)        { f.push([deSmart(p.rooms, 1), 'Zimmer']); }
  if (p.living_space) { f.push([deSmart(p.living_space, 1) + ' <small>m&sup2;</small>', 'Wohnfl&auml;che']); }
  if (p.plot_size)    { f.push([deSmart(p.plot_size, 1) + ' <small>m&sup2;</small>', 'Grundst&uuml;ck']); }
  if (p.year_built)   { f.push([String(p.year_built), 'Baujahr']); }
  if (!f.length) { return ''; }

/* ============================================================
   Ablaufplan
   ============================================================
   Rhythmus je Runde: zwei Angebote, eine Inhaltsfolie,
   ein weiteres Angebot, eine Referenz, eine Inhaltsfolie.
   Fehlt eine Gattung, wird sie uebersprungen.
   ============================================================ */
var INHALTE = [
  function(){ return { html: slideAuftakt(),  ms: CONTENT_MS }; },
  function(){ return { html: slideBereich(0), ms: CONTENT_MS }; },
  function(){ return { html: slideStimme(0),  ms: CONTENT_MS }; },
  function(){ return { html: slideBereich(1), ms: CONTENT_MS }; },
  function(){ return { html: slideApp(),      ms: CONTENT_MS + 4000 }; },
  function(){ return { html: slideStimme(1),  ms: CONTENT_MS }; },
  function(){ return { html: slideBereich(2), ms: CONTENT_MS }; }
];

function nextOffer(){
  if (!offers.length) { return null; }
  var p = offers[offerPos % offers.length];
  offerPos++;
  return { html: slideObjekt(p), ms: SLIDE_MS, img: firstImg(p) };
}
function nextRef(){
  if (!refs.length) { return null; }
  var p = refs[refPos % refs.length];
  refPos++;
  return { html: slideReferenz(p), ms: SLIDE_MS, img: firstImg(p) };
}
function nextContent(){
  var f = INHALTE[contentPos % INHALTE.length];
  contentPos++;
  return f();
}
function firstImg(p){
  return (p._imgs && p._imgs.length) ? p._imgs[0] : null;
}

function buildPlaylist(){
  var out = [], s;
  var pattern = ['offer','offer','content','offer','ref','content'];
  for (var i = 0; i < pattern.length; i++){
    if (pattern[i] === 'offer')        { s = nextOffer(); }
    else if (pattern[i] === 'ref')     { s = nextRef(); }
    else                               { s = nextContent(); }
    if (s) { out.push(s); }
  }
  /* Falls gar keine Objekte vorhanden sind, laufen nur Inhaltsfolien. */
  if (!out.length) {
    for (var j = 0; j < INHALTE.length; j++){ out.push(nextContent()); }
  }
  return out;
}

/* ============================================================
   Darstellung
   ============================================================ */

/* Schlagzeile auf eine Zeile bringen: Schriftgroesse
   schrittweise reduzieren, bis das Wort hineinpasst. */
function fitHeadlines(root){
  var els = root.getElementsByClassName('headline');
  for (var i = 0; i < els.length; i++){
    var el = els[i];
    var max = parseFloat(window.getComputedStyle
      ? window.getComputedStyle(el).fontSize
      : '170');
    var size = max;
    var min  = max * 0.34;
    var guard = 0;
    while (el.scrollWidth > el.clientWidth && size > min && guard < 200) {
      size = size * 0.96;
      el.style.fontSize = size + 'px';
      guard++;
    }
  }
}

function show(html, ms){
  var el = document.createElement('div');
  el.className = 'slide';
  el.innerHTML = html;
  stage.appendChild(el);

  bilderAbsichern(el);
  fitHeadlines(el);

  /* Reflow erzwingen, damit der Opacity-Uebergang greift */
  /* jshint -W030 */
  el.offsetHeight;
  el.className = 'slide is-active';

  if (current) {
    var old = current;
    old.className = 'slide is-out';
    window.setTimeout(function(){
      if (old.parentNode) { old.parentNode.removeChild(old); }
    }, 1100);
  }
  current = el;
  runBar(ms);
}

function runBar(ms){
  /* Zuruecksetzen ohne Uebergang, Reflow erzwingen, dann in einem
     Zug linear durchlaufen lassen. */
  barEl.style.webkitTransition = 'none';
  barEl.style.transition = 'none';
  barEl.style.webkitTransform = 'scaleX(0)';
  barEl.style.transform = 'scaleX(0)';
  /* jshint -W030 */
  barEl.offsetHeight;
  barEl.style.webkitTransition = '-webkit-transform ' + ms + 'ms linear';
  barEl.style.transition = 'transform ' + ms + 'ms linear';
  barEl.style.webkitTransform = 'scaleX(1)';
  barEl.style.transform = 'scaleX(1)';
}

/* ------------------------------------------------------------
   Bildverwaltung

   Die Objektfotos kommen aus der Cloud und brauchen manchmal
   laenger als eine Folie steht. Deshalb werden sie vorgeladen
   und die geladenen Bilder behalten, damit sie beim naechsten
   Durchlauf sofort da sind. Schlaegt ein Bild fehl, wird es
   einmal erneut versucht; klappt auch das nicht, bleibt statt
   eines kaputten Symbols eine ruhige Flaeche stehen.
   ------------------------------------------------------------ */
var bildCache = {};
var bildReihe = [];

function preload(url){
  if (!url || bildCache[url]) { return; }
  var im = new Image();
  im.src = url;
  bildCache[url] = im;
  bildReihe.push(url);
  while (bildReihe.length > 40) {
    delete bildCache[bildReihe.shift()];
  }
}

function bilderAbsichern(root){
  var imgs = root.getElementsByTagName('img');
  for (var i = 0; i < imgs.length; i++){
    (function(img){
      img.onerror = function(){
        if (!img.getAttribute('data-retry')) {
          img.setAttribute('data-retry', '1');
          var src = img.src;
          window.setTimeout(function(){
            img.src = src + (src.indexOf('?') === -1 ? '?' : '&') + 'r=' + nowMs();
          }, 1500);
          return;
        }
        img.style.visibility = 'hidden';
        dbg('Bild nicht ladbar: ' + img.src);
      };
      /* Falls das Bild schon im Cache steckt und bereits fehlerhaft
         war, greift onerror nicht mehr - deshalb hier pruefen. */
      if (img.complete && img.naturalWidth === 0 && img.src) { img.onerror(); }
    })(imgs[i]);
  }
}

function tick(){
  /* Geplanter Neustart nur an einer Folienkante, damit nie
     mitten in der Anzeige neu geladen wird. */
  if (nowMs() - bootTime > RELOAD_AFTER) {
    dbg('geplanter Reload');
    window.location.reload();
    return;
  }

  /* Neue Daten uebernehmen - die Zaehler laufen weiter, daher
     springt die Rotation dabei nicht sichtbar zurueck. */
  if (datenNeu) {
    datenNeu = false;
    playlist = buildPlaylist();
    playPos = 0;
  }

  if (playPos >= playlist.length) {
    playlist = buildPlaylist();
    playPos = 0;
  }

  var s = playlist[playPos];
  playPos++;
  show(s.html, s.ms);

  if (playPos < playlist.length) { preload(playlist[playPos].img); }

  timer = window.setTimeout(tick, s.ms);
}

function start(){
  if (timer) { window.clearTimeout(timer); }
  playlist = buildPlaylist();
  playPos = 0;
  tick();
}

/* Falls doch ein Fehler durchrutscht: nicht mit leerer Seite
   stehen bleiben, sondern nach 30 s neu laden. */
window.onerror = function(m, src, line){
  dbg('JS-Fehler: ' + m + ' @' + line);
  window.setTimeout(function(){ window.location.reload(); }, 30000);
  return true;
};

load();
window.setInterval(pulse, PULSE_MS);   /* alle 30 s: hat sich etwas geaendert? */
window.setInterval(load,  REFRESH_MS); /* alle 10 min: Vollabruf als Sicherheitsnetz */

/* Falls der erste Abruf haengt: nach 8 s trotzdem etwas zeigen */
window.setTimeout(function(){
  if (!current) {
    var cached = loadCache();
    if (cached) { partition(cached); }
    start();
  }
}, 8000);

})();
